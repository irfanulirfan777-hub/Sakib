<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌈 Rainbow Calculator | Colorful Theme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Prevents accidental text selection on buttons */
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a1e2c 0%, #2d2438 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', 'Courier New', monospace;
            padding: 20px;
        }

        /* Rainbow Glow Container */
        .calculator {
            background: #0b0b12;
            border-radius: 3.5rem;
            padding: 1.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.05);
            position: relative;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 480px;
        }

        /* Animated rainbow border */
        .calculator::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, 
                #ff0a54, #ff5e00, #ffbd00, #9eff00, #00ffcc, #3a0ca3, #f200ff, #ff0a54);
            background-size: 300% 300%;
            border-radius: 3.7rem;
            z-index: -1;
            filter: blur(12px);
            opacity: 0.8;
            animation: rainbowFlow 8s ease infinite;
        }

        /* second gradient layer for extra pop */
        .calculator::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(115deg, 
                #ff4d6d, #ff9e00, #ffee32, #6eff00, #00f5d4, #b5179e, #ff4d6d);
            background-size: 200% 200%;
            border-radius: 3.65rem;
            z-index: -1;
            opacity: 0.5;
            animation: rainbowFlow 12s ease infinite reverse;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Display area with rainbow touch */
        .display {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 2.2rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.8rem;
            text-align: right;
            font-size: 2.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            font-family: 'Orbitron', 'Courier New', monospace;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 100px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5), 0 0 8px rgba(255,255,200,0.3);
            border: 1px solid rgba(255,215,0,0.5);
            transition: all 0.2s;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        /* rainbow reflection on display */
        .display span {
            background: linear-gradient(90deg, #ff6a6a, #ffd966, #a0ff7a, #6ac4ff, #e36eff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-weight: bold;
        }

        /* Grid layout */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }

        /* button base style - each will have individual rainbow color */
        button {
            border: none;
            background: #2a2a3a;
            padding: 1.2rem 0;
            font-size: 1.7rem;
            font-weight: bold;
            border-radius: 2rem;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s, box-shadow 0.1s;
            font-family: 'Segoe UI', 'Poppins', monospace;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
            filter: brightness(0.95);
        }

        /* hover effect: extra glow */
        button:hover {
            filter: brightness(1.08) saturate(1.2);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3), 0 0 6px currentColor;
        }

        /* special rainbow vibrant background per button — dynamic rainbow theme */
        /* Each button gets a unique HSL color via JS or inline style? We'll assign by index in JS for perfect rainbow */
        /* But fallback: we'll dynamically set colors via script after load, ensuring uniform rainbow look */
        /* To avoid FOUC, we set default bg, but JS will override with bright rainbow spectrum */

        /* Responsive */
        @media (max-width: 500px) {
            .calculator {
                padding: 1rem;
            }
            button {
                padding: 0.9rem 0;
                font-size: 1.4rem;
            }
            .display {
                font-size: 2rem;
                padding: 0.8rem 1.2rem;
                min-height: 85px;
            }
            .buttons {
                gap: 0.5rem;
            }
        }

        @media (max-width: 400px) {
            button {
                font-size: 1.2rem;
                padding: 0.7rem 0;
            }
            .display {
                font-size: 1.7rem;
            }
        }

        /* make zero/wide button span? but we like 4x5 grid well-balanced */
        .equal-btn {
            background: radial-gradient(circle at 30% 10%, #ffb347, #ff6b6b);
        }
        .operator-pulse {
            font-weight: 800;
        }
        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: rgba(255,255,200,0.6);
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons" id="buttonsContainer">
        <!-- Buttons will be generated via JS for easier rainbow mapping -->
    </div>
    <footer>🌈 rainbow mode | every click magic</footer>
</div>

<script>
    // ----- Calculator Core Logic -----
    let currentInput = "0";       // current shown value
    let previousValue = null;
    let currentOperator = null;
    let waitingForNewOperand = false;   // after pressing operator, ready for next number
    let errorFlag = false;

    const displayEl = document.getElementById("display");

    function updateDisplay() {
        if (errorFlag) {
            displayEl.innerText = "ERROR";
            return;
        }
        // limit length for UI but keep full internally
        let showValue = currentInput;
        if (showValue.length > 14) {
            showValue = parseFloat(showValue).toExponential(8);
        }
        displayEl.innerText = showValue;
    }

    function clearAll() {
        currentInput = "0";
        previousValue = null;
        currentOperator = null;
        waitingForNewOperand = false;
        errorFlag = false;
        updateDisplay();
    }

    function backspace() {
        if (errorFlag) {
            clearAll();
            return;
        }
        if (waitingForNewOperand) return; // don't backspace when expecting new number
        if (currentInput.length === 1) {
            currentInput = "0";
        } else {
            currentInput = currentInput.slice(0, -1);
            if (currentInput === "" || currentInput === "-") currentInput = "0";
        }
        updateDisplay();
    }

    function appendNumber(number) {
        if (errorFlag) {
            clearAll();
        }
        if (waitingForNewOperand) {
            currentInput = number.toString();
            waitingForNewOperand = false;
        } else {
            // prevent multiple leading zeros
            if (currentInput === "0" && number === 0) return;
            if (currentInput === "0" && number !== ".") {
                currentInput = number.toString();
            } else {
                currentInput += number.toString();
            }
        }
        updateDisplay();
    }

    function appendDecimal() {
        if (errorFlag) {
            clearAll();
        }
        if (waitingForNewOperand) {
            currentInput = "0.";
            waitingForNewOperand = false;
            updateDisplay();
            return;
        }
        if (!currentInput.includes(".")) {
            currentInput += ".";
        }
        updateDisplay();
    }

    function setOperator(op) {
        if (errorFlag) {
            clearAll();
        }
        // if we are already waiting for new operand, just replace operator
        if (currentOperator !== null && waitingForNewOperand) {
            currentOperator = op;
            updateDisplay();
            return;
        }
        // if there is a previous value & operator, compute before new operator
        if (previousValue !== null && currentOperator !== null && !waitingForNewOperand) {
            calculate();
        }
        // after calculation, currentInput holds the result
        previousValue = parseFloat(currentInput);
        currentOperator = op;
        waitingForNewOperand = true;
        updateDisplay();
    }

    function calculate() {
        if (errorFlag) return;
        if (currentOperator === null || previousValue === null || waitingForNewOperand) {
            // if equals pressed without proper operator, just return current
            return;
        }
        let secondValue = parseFloat(currentInput);
        let result;
        switch (currentOperator) {
            case '+':
                result = previousValue + secondValue;
                break;
            case '-':
                result = previousValue - secondValue;
                break;
            case '*':
                result = previousValue * secondValue;
                break;
            case '/':
                if (secondValue === 0) {
                    errorFlag = true;
                    currentInput = "0";
                    previousValue = null;
                    currentOperator = null;
                    waitingForNewOperand = false;
                    updateDisplay();
                    return;
                }
                result = previousValue / secondValue;
                break;
            default:
                return;
        }
        // handle floating precision
        result = parseFloat(result.toFixed(10));
        currentInput = result.toString();
        previousValue = null;
        currentOperator = null;
        waitingForNewOperand = false;
        updateDisplay();
    }

    function evaluateEquals() {
        if (errorFlag) return;
        if (currentOperator !== null && previousValue !== null && !waitingForNewOperand) {
            calculate();
        } else if (currentOperator !== null && waitingForNewOperand) {
            // nothing to compute, just reset operator state
            currentOperator = null;
            previousValue = null;
        }
        // after equals, we are not waiting for operand
        waitingForNewOperand = false;
        currentOperator = null;
        previousValue = null;
        updateDisplay();
    }

    // ----- RAINBOW BUTTONS GENERATION -----
    // Button definitions: text, action type, value (if number/operator)
    // We'll create all buttons in order and assign vibrant rainbow colors based on index.
    
    const buttonsConfig = [
        { text: "C", action: "clear" },
        { text: "⌫", action: "backspace" },
        { text: "/", action: "operator", value: "/" },
        { text: "*", action: "operator", value: "*" },
        { text: "7", action: "number", value: 7 },
        { text: "8", action: "number", value: 8 },
        { text: "9", action: "number", value: 9 },
        { text: "-", action: "operator", value: "-" },
        { text: "4", action: "number", value: 4 },
        { text: "5", action: "number", value: 5 },
        { text: "6", action: "number", value: 6 },
        { text: "+", action: "operator", value: "+" },
        { text: "1", action: "number", value: 1 },
        { text: "2", action: "number", value: 2 },
        { text: "3", action: "number", value: 3 },
        { text: "=", action: "equal" },
        { text: "0", action: "number", value: 0 },
        { text: ".", action: "decimal" },
        { text: "00", action: "number", value: "00" },    // extra for convenience
        { text: "%", action: "percent" }                 // extra fun percent function
    ];
    
    // Additional percent logic (percentage of current value)
    function applyPercent() {
        if (errorFlag) {
            clearAll();
        }
        if (waitingForNewOperand) return;
        let num = parseFloat(currentInput);
        if (isNaN(num)) return;
        let percentVal = num / 100;
        currentInput = percentVal.toString();
        updateDisplay();
    }
    
    // handler for number '00'
    function appendDoubleZero() {
        if (errorFlag) clearAll();
        if (waitingForNewOperand) {
            currentInput = "0";
            waitingForNewOperand = false;
        }
        if (currentInput === "0") {
            currentInput = "0";
        } else {
            currentInput += "00";
        }
        updateDisplay();
    }
    
    const container = document.getElementById("buttonsContainer");
    
    // Create buttons with rainbow colors using HSL: hue = (index * 18) % 360, high saturation & lightness for joyful look
    // but ensure text readable: dark text for light backgrounds? white text works with dark-ish background. We'll keep white text.
    // Use vivid saturation: 75% lightness 65% for vibrant neon touch.
    
    buttonsConfig.forEach((btn, idx) => {
        const button = document.createElement("button");
        button.textContent = btn.text;
        // Rainbow magic: hue shift based on index (full spectrum)
        const hue = (idx * 22) % 360;  // 22 deg step makes 16-17 distinct colors, plenty of rainbow variation
        const saturation = 80;
        const lightness = 58;
        button.style.background = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        button.style.borderBottom = `3px solid hsl(${hue}, 90%, 35%)`;
        button.style.transition = "all 0.1s ease";
        // add glow on hover for each button matching its hue
        button.addEventListener("mouseenter", () => {
            button.style.boxShadow = `0 0 12px hsl(${hue}, 85%, 65%)`;
        });
        button.addEventListener("mouseleave", () => {
            button.style.boxShadow = "0 6px 0 rgba(0, 0, 0, 0.2)";
        });
        
        // action mapping
        button.addEventListener("click", (e) => {
            e.preventDefault();
            switch (btn.action) {
                case "clear":
                    clearAll();
                    break;
                case "backspace":
                    backspace();
                    break;
                case "number":
                    if (btn.value === "00") {
                        appendDoubleZero();
                    } else {
                        appendNumber(btn.value);
                    }
                    break;
                case "operator":
                    setOperator(btn.value);
                    break;
                case "equal":
                    evaluateEquals();
                    break;
                case "decimal":
                    appendDecimal();
                    break;
                case "percent":
                    applyPercent();
                    break;
                default:
                    break;
            }
        });
        container.appendChild(button);
    });
    
    // Extra keyboard support for better experience!
    document.addEventListener("keydown", (e) => {
        const key = e.key;
        // Prevent default if needed but avoid interfering with input
        if (/[0-9]/.test(key)) {
            e.preventDefault();
            appendNumber(parseInt(key));
        } else if (key === ".") {
            e.preventDefault();
            appendDecimal();
        } else if (key === "Enter" || key === "=") {
            e.preventDefault();
            evaluateEquals();
        } else if (key === "+") {
            e.preventDefault();
            setOperator("+");
        } else if (key === "-") {
            e.preventDefault();
            setOperator("-");
        } else if (key === "*") {
            e.preventDefault();
            setOperator("*");
        } else if (key === "/") {
            e.preventDefault();
            setOperator("/");
        } else if (key === "Backspace") {
            e.preventDefault();
            backspace();
        } else if (key === "Escape" || key === "c" || key === "C") {
            e.preventDefault();
            clearAll();
        } else if (key === "%") {
            e.preventDefault();
            applyPercent();
        }
    });
    
    // Initial display
    updateDisplay();
    
    // Little extra: dynamic rainbow background hover on calculator container (optional fun)
    const calcContainer = document.querySelector(".calculator");
    if(calcContainer) {
        calcContainer.addEventListener("mousemove", (e) => {
            let x = e.clientX / window.innerWidth;
            let y = e.clientY / window.innerHeight;
            let hueRotate = Math.floor(x * 360 + y * 180);
            calcContainer.style.transition = "box-shadow 0.2s";
            calcContainer.style.boxShadow = `0 20px 35px rgba(0,0,0,0.5), 0 0 0 2px hsl(${hueRotate}, 80%, 65%)`;
        });
        calcContainer.addEventListener("mouseleave", () => {
            calcContainer.style.boxShadow = "0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.05)";
        });
    }
    
    // ensure the rainbow border animation persists but also adapt individual style
    // add class for fun: animate the display text based on rainbow gradient as well
    const displayDiv = document.getElementById("display");
    if(displayDiv) {
        setInterval(() => {
            if(!errorFlag && displayDiv.innerText !== "ERROR") {
                // soft rainbow flicker to display text edge (glow)
                let hue = (Date.now() / 50) % 360;
                displayDiv.style.textShadow = `0 0 4px hsl(${hue}, 100%, 65%), 0 0 8px rgba(255,128,0,0.5)`;
            } else if(errorFlag){
                displayDiv.style.textShadow = "0 0 8px red";
            }
        }, 300);
    }
    
    // optional: adjust button font boldness for operators
    const allBtns = document.querySelectorAll("button");
    allBtns.forEach(btn => {
        if(btn.textContent === "+" || btn.textContent === "-" || btn.textContent === "*" || btn.textContent === "/" || btn.textContent === "="){
            btn.style.fontWeight = "800";
            btn.style.fontSize = "1.9rem";
        }
        if(btn.textContent === "C" || btn.textContent === "⌫"){
            btn.style.fontWeight = "bold";
        }
    });
    
    // polish responsive: ensure zero and double zero fits well
    const styleTag = document.createElement('style');
    styleTag.textContent = `
        button:nth-child(17) { font-size: 1.7rem; } /* 0 */
        button:nth-child(19) { font-size: 1.4rem; } /* 00 */
        button:nth-child(20) { font-size: 1.6rem; } /* % */
        @media (max-width: 450px) {
            button { font-size: 1.3rem; padding: 0.8rem 0; }
            button:nth-child(19) { font-size: 1.1rem; }
        }
    `;
